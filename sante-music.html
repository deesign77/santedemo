<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sante</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Montserrat:wght@200;300&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --klein-blue: #002fa7;
            --black: #000000;
            --white: #ffffff;
        }

        body {
            background-color: var(--black);
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            overflow-x: hidden;
        }

        .title {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(4rem, 15vw, 12rem);
            font-weight: 300;
            color: var(--klein-blue);
            letter-spacing: 0.05em;
            margin-bottom: 4rem;
            opacity: 0;
            animation: fadeInTitle 2s ease-out forwards;
            text-align: center;
            position: relative;
        }

        .title::after {
            content: '';
            position: absolute;
            bottom: -1rem;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            height: 1px;
            background: linear-gradient(90deg, 
                transparent, 
                var(--klein-blue) 50%, 
                transparent);
            opacity: 0.3;
        }

        @keyframes fadeInTitle {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .player-container {
            max-width: 500px;
            width: 100%;
            opacity: 0;
            animation: fadeInPlayer 1.5s ease-out 0.5s forwards;
        }

        @keyframes fadeInPlayer {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .track {
            background: rgba(0, 47, 167, 0.05);
            border: 1px solid rgba(0, 47, 167, 0.2);
            padding: 1.5rem;
            margin-bottom: 1rem;
            border-radius: 2px;
            cursor: pointer;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
        }

        .track::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, 
                transparent, 
                rgba(0, 47, 167, 0.1), 
                transparent);
            transition: left 0.6s ease;
        }

        .track:hover::before {
            left: 100%;
        }

        .track:hover {
            background: rgba(0, 47, 167, 0.08);
            border-color: rgba(0, 47, 167, 0.4);
            transform: translateX(5px);
        }

        .track.playing {
            background: rgba(0, 47, 167, 0.12);
            border-color: var(--klein-blue);
        }

        .track-name {
            color: var(--klein-blue);
            font-size: 1rem;
            font-weight: 300;
            letter-spacing: 0.1em;
            margin-bottom: 0.5rem;
        }

        .track-duration {
            color: rgba(0, 47, 167, 0.5);
            font-size: 0.75rem;
            font-weight: 200;
            letter-spacing: 0.05em;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-top: 2rem;
            padding: 1.5rem;
            background: rgba(0, 47, 167, 0.03);
            border: 1px solid rgba(0, 47, 167, 0.15);
            border-radius: 2px;
        }

        .play-btn {
            width: 48px;
            height: 48px;
            border: 1px solid var(--klein-blue);
            background: transparent;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }

        .play-btn:hover {
            background: rgba(0, 47, 167, 0.1);
            transform: scale(1.05);
        }

        .play-btn::before {
            content: '';
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 8px 0 8px 14px;
            border-color: transparent transparent transparent var(--klein-blue);
            margin-left: 3px;
        }

        .play-btn.playing::before {
            border-style: double;
            border-width: 0 0 0 14px;
            border-color: transparent transparent transparent var(--klein-blue);
            margin-left: 0;
        }

        .progress-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .current-track-name {
            color: var(--klein-blue);
            font-size: 0.75rem;
            font-weight: 300;
            letter-spacing: 0.1em;
            opacity: 0.7;
        }

        .progress-bar {
            width: 100%;
            height: 2px;
            background: rgba(0, 47, 167, 0.2);
            position: relative;
            cursor: pointer;
        }

        .progress-fill {
            height: 100%;
            background: var(--klein-blue);
            width: 0%;
            transition: width 0.1s linear;
        }

        .time-display {
            display: flex;
            justify-content: space-between;
            color: rgba(0, 47, 167, 0.5);
            font-size: 0.7rem;
            font-weight: 200;
            letter-spacing: 0.05em;
        }



        .upload-zone {
            margin-top: 3rem;
            padding: 2rem;
            border: 2px dashed rgba(0, 47, 167, 0.3);
            border-radius: 2px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            display: none;
        }

        .upload-zone.admin-mode {
            display: block;
        }

        .upload-zone:hover {
            border-color: var(--klein-blue);
            background: rgba(0, 47, 167, 0.03);
        }

        .upload-zone.dragover {
            border-color: var(--klein-blue);
            background: rgba(0, 47, 167, 0.08);
        }

        .upload-label {
            color: var(--klein-blue);
            font-size: 0.85rem;
            font-weight: 300;
            letter-spacing: 0.1em;
            opacity: 0.6;
        }

        input[type="file"] {
            display: none;
        }

        .admin-panel {
            position: fixed;
            top: 1rem;
            right: 1rem;
            display: flex;
            gap: 0.5rem;
            align-items: center;
            z-index: 1000;
        }

        .admin-btn {
            padding: 0.5rem 1rem;
            background: transparent;
            border: 1px solid rgba(0, 47, 167, 0.3);
            color: var(--klein-blue);
            font-family: 'Montserrat', sans-serif;
            font-size: 0.7rem;
            font-weight: 300;
            letter-spacing: 0.1em;
            cursor: pointer;
            border-radius: 2px;
            transition: all 0.3s ease;
        }

        .admin-btn:hover {
            background: rgba(0, 47, 167, 0.1);
            border-color: var(--klein-blue);
        }

        .admin-indicator {
            color: var(--klein-blue);
            font-size: 0.7rem;
            font-weight: 300;
            letter-spacing: 0.1em;
            opacity: 0.6;
        }

        .login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        .login-overlay.active {
            display: flex;
        }

        .login-box {
            background: var(--black);
            border: 1px solid var(--klein-blue);
            padding: 3rem;
            border-radius: 2px;
            max-width: 400px;
            width: 90%;
        }

        .login-title {
            color: var(--klein-blue);
            font-size: 1.5rem;
            font-weight: 300;
            letter-spacing: 0.1em;
            margin-bottom: 2rem;
            text-align: center;
        }

        .login-input {
            width: 100%;
            padding: 1rem;
            background: transparent;
            border: 1px solid rgba(0, 47, 167, 0.3);
            color: var(--klein-blue);
            font-family: 'Montserrat', sans-serif;
            font-size: 0.9rem;
            font-weight: 300;
            letter-spacing: 0.1em;
            margin-bottom: 1rem;
            border-radius: 2px;
            transition: all 0.3s ease;
        }

        .login-input:focus {
            outline: none;
            border-color: var(--klein-blue);
            background: rgba(0, 47, 167, 0.03);
        }

        .login-submit {
            width: 100%;
            padding: 1rem;
            background: transparent;
            border: 1px solid var(--klein-blue);
            color: var(--klein-blue);
            font-family: 'Montserrat', sans-serif;
            font-size: 0.9rem;
            font-weight: 300;
            letter-spacing: 0.1em;
            cursor: pointer;
            border-radius: 2px;
            transition: all 0.3s ease;
            margin-top: 1rem;
        }

        .login-submit:hover {
            background: rgba(0, 47, 167, 0.1);
        }

        .login-error {
            color: #ff4444;
            font-size: 0.75rem;
            font-weight: 300;
            letter-spacing: 0.05em;
            margin-top: 1rem;
            text-align: center;
            display: none;
        }

        .login-error.active {
            display: block;
        }

        .delete-btn {
            background: transparent;
            border: 1px solid rgba(255, 68, 68, 0.3);
            color: #ff4444;
            padding: 0.3rem 0.6rem;
            font-size: 0.65rem;
            font-weight: 300;
            letter-spacing: 0.05em;
            cursor: pointer;
            border-radius: 2px;
            transition: all 0.3s ease;
            margin-top: 0.5rem;
            display: none;
        }

        .delete-btn.admin-mode {
            display: inline-block;
        }

        .delete-btn:hover {
            background: rgba(255, 68, 68, 0.1);
            border-color: #ff4444;
        }

        @media (max-width: 768px) {
            .title {
                font-size: 3rem;
                margin-bottom: 2rem;
            }

            .track {
                padding: 1rem;
            }

            .controls {
                padding: 1rem;
            }

            .admin-panel {
                top: 0.5rem;
                right: 0.5rem;
            }

            .login-box {
                padding: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="admin-panel">
        <span class="admin-indicator" id="adminIndicator"></span>
        <button class="admin-btn" id="adminToggle">ADMIN</button>
    </div>

    <div class="login-overlay" id="loginOverlay">
        <div class="login-box">
            <h2 class="login-title">MODE ADMINISTRATEUR</h2>
            <input type="password" class="login-input" id="passwordInput" placeholder="Mot de passe">
            <button class="login-submit" id="loginSubmit">SE CONNECTER</button>
            <div class="login-error" id="loginError">Mot de passe incorrect</div>
        </div>
    </div>

    <h1 class="title">Sante</h1>
    
    <div class="player-container">
        <div id="trackList"></div>
        
        <div class="controls">
            <button class="play-btn" id="playBtn"></button>
            <div class="progress-container">
                <div class="current-track-name" id="currentTrackName">Aucune piste sélectionnée</div>
                <div class="progress-bar" id="progressBar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="time-display">
                    <span id="currentTime">0:00</span>
                    <span id="duration">0:00</span>
                </div>
            </div>
        </div>

        <div class="upload-zone" id="uploadZone">
            <label for="fileInput" class="upload-label">
                CLIQUEZ OU DÉPOSEZ VOS FICHIERS AUDIO ICI
            </label>
            <input type="file" id="fileInput" accept="audio/*" multiple>
        </div>

    </div>

    <audio id="audioPlayer"></audio>

    <script>
        const audioPlayer = document.getElementById('audioPlayer');
        const playBtn = document.getElementById('playBtn');
        const trackList = document.getElementById('trackList');
        const currentTrackName = document.getElementById('currentTrackName');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');
        const currentTimeEl = document.getElementById('currentTime');
        const durationEl = document.getElementById('duration');
        const uploadZone = document.getElementById('uploadZone');
        const fileInput = document.getElementById('fileInput');
        const adminToggle = document.getElementById('adminToggle');
        const loginOverlay = document.getElementById('loginOverlay');
        const passwordInput = document.getElementById('passwordInput');
        const loginSubmit = document.getElementById('loginSubmit');
        const loginError = document.getElementById('loginError');
        const adminIndicator = document.getElementById('adminIndicator');

        // CHANGEZ CE MOT DE PASSE
        const ADMIN_PASSWORD = 'sante2026';

        let isAdmin = false;
        let tracks = [];
        let currentTrackIndex = -1;

        // Charger les morceaux depuis le localStorage
        function loadTracks() {
            const saved = localStorage.getItem('sante_tracks');
            if (saved) {
                tracks = JSON.parse(saved);
                renderTracks();
            }
        }

        // Sauvegarder les morceaux dans le localStorage
        function saveTracks() {
            localStorage.setItem('sante_tracks', JSON.stringify(tracks));
        }

        // Bouton admin
        adminToggle.addEventListener('click', () => {
            if (isAdmin) {
                logout();
            } else {
                loginOverlay.classList.add('active');
                passwordInput.focus();
            }
        });

        // Connexion admin
        loginSubmit.addEventListener('click', () => {
            login();
        });

        passwordInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                login();
            }
        });

        function login() {
            if (passwordInput.value === ADMIN_PASSWORD) {
                isAdmin = true;
                loginOverlay.classList.remove('active');
                loginError.classList.remove('active');
                passwordInput.value = '';
                updateAdminUI();
            } else {
                loginError.classList.add('active');
                passwordInput.value = '';
                passwordInput.focus();
            }
        }

        function logout() {
            isAdmin = false;
            updateAdminUI();
        }

        function updateAdminUI() {
            if (isAdmin) {
                uploadZone.classList.add('admin-mode');
                adminToggle.textContent = 'DÉCONNEXION';
                adminIndicator.textContent = 'MODE ADMIN';
                document.querySelectorAll('.delete-btn').forEach(btn => {
                    btn.classList.add('admin-mode');
                });
            } else {
                uploadZone.classList.remove('admin-mode');
                adminToggle.textContent = 'ADMIN';
                adminIndicator.textContent = '';
                document.querySelectorAll('.delete-btn').forEach(btn => {
                    btn.classList.remove('admin-mode');
                });
            }
        }

        // Gestion du drag & drop
        uploadZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            if (isAdmin) {
                uploadZone.classList.add('dragover');
            }
        });

        uploadZone.addEventListener('dragleave', () => {
            uploadZone.classList.remove('dragover');
        });

        uploadZone.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadZone.classList.remove('dragover');
            if (isAdmin) {
                const files = Array.from(e.dataTransfer.files).filter(file => file.type.startsWith('audio/'));
                handleFiles(files);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (isAdmin) {
                const files = Array.from(e.target.files);
                handleFiles(files);
            }
        });

        uploadZone.addEventListener('click', () => {
            if (isAdmin) {
                fileInput.click();
            }
        });

        function handleFiles(files) {
            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    tracks.push({
                        name: file.name.replace(/\.[^/.]+$/, ''),
                        data: e.target.result,
                        duration: 0
                    });
                    saveTracks();
                    renderTracks();
                };
                reader.readAsDataURL(file);
            });
        }

        function renderTracks() {
            trackList.innerHTML = '';
            tracks.forEach((track, index) => {
                const trackEl = document.createElement('div');
                trackEl.className = 'track';
                trackEl.innerHTML = `
                    <div class="track-name">${track.name}</div>
                    <div class="track-duration">${formatTime(track.duration)}</div>
                    <button class="delete-btn ${isAdmin ? 'admin-mode' : ''}" data-index="${index}">SUPPRIMER</button>
                `;
                trackEl.addEventListener('click', (e) => {
                    if (!e.target.classList.contains('delete-btn')) {
                        loadTrack(index);
                    }
                });
                trackList.appendChild(trackEl);
            });

            // Ajouter les événements de suppression
            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const index = parseInt(btn.dataset.index);
                    deleteTrack(index);
                });
            });
        }

        function deleteTrack(index) {
            if (isAdmin && confirm('Supprimer ce morceau ?')) {
                tracks.splice(index, 1);
                saveTracks();
                renderTracks();
                if (currentTrackIndex === index) {
                    audioPlayer.pause();
                    currentTrackIndex = -1;
                    currentTrackName.textContent = 'Aucune piste sélectionnée';
                    playBtn.classList.remove('playing');
                }
            }
        }

        function loadTrack(index) {
            currentTrackIndex = index;
            const track = tracks[index];
            audioPlayer.src = track.data;
            currentTrackName.textContent = track.name;
            
            document.querySelectorAll('.track').forEach((el, i) => {
                el.classList.toggle('playing', i === index);
            });

            audioPlayer.play();
            playBtn.classList.add('playing');
        }

        playBtn.addEventListener('click', () => {
            if (currentTrackIndex === -1 && tracks.length > 0) {
                loadTrack(0);
            } else if (audioPlayer.paused) {
                audioPlayer.play();
                playBtn.classList.add('playing');
            } else {
                audioPlayer.pause();
                playBtn.classList.remove('playing');
            }
        });

        audioPlayer.addEventListener('timeupdate', () => {
            const progress = (audioPlayer.currentTime / audioPlayer.duration) * 100;
            progressFill.style.width = progress + '%';
            currentTimeEl.textContent = formatTime(audioPlayer.currentTime);
        });

        audioPlayer.addEventListener('loadedmetadata', () => {
            durationEl.textContent = formatTime(audioPlayer.duration);
            if (currentTrackIndex !== -1) {
                tracks[currentTrackIndex].duration = audioPlayer.duration;
                saveTracks();
                renderTracks();
            }
        });

        audioPlayer.addEventListener('ended', () => {
            if (currentTrackIndex < tracks.length - 1) {
                loadTrack(currentTrackIndex + 1);
            } else {
                playBtn.classList.remove('playing');
            }
        });

        progressBar.addEventListener('click', (e) => {
            const rect = progressBar.getBoundingClientRect();
            const percent = (e.clientX - rect.left) / rect.width;
            audioPlayer.currentTime = percent * audioPlayer.duration;
        });

        function formatTime(seconds) {
            if (isNaN(seconds)) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        // Initialiser
        loadTracks();
    </script>
</body>
</html>
